        .game-card h2 { font-size: 1.1em; margin: 10px 0; color: #fff; }
        a { display: inline-block; padding: 10px 20px; background: #00E676; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
