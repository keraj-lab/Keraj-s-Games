    const snapshot={money,home,bikeId,owned:[...owned],worldX:world.x,worldY:world.y,gameMinutes,score,nitro,raceTheme,raceBikeChoice,playerName,updatedAt:Date.now()};
    localStorage.setItem('kgcw_progress_v22',JSON.stringify(snapshot));
    localStorage.setItem('kgcw_game_minutes',String(gameMinutes));
    localStorage.setItem('kgcw_race_theme',raceTheme);localStorage.setItem('kgcw_race_bike',raceBikeChoice);
    if(playerName)localStorage.setItem('kgcw_player_name',playerName);
  }catch(e){console.warn('Progress save failed:',e);}
}
function save(){try{localStorage.setItem('kgcw_money',money);localStorage.setItem('kgcw_home',home);localStorage.setItem('kgcw_bike',bikeId);localStorage.setItem('kgcw_owned',JSON.stringify(owned));}catch(e){}refreshTop();saveProgress()}

function safeText(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}

function localNameKey(name){return String(name||'').trim().normalize('NFKC').toLowerCase();}
function getNameOwnerToken(){
  let token=localStorage.getItem('kgcw_v17_name_owner_token')||'';
  if(!token){
    try{token=(crypto&&crypto.randomUUID)?crypto.randomUUID():('kgcw-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));}
    catch(e){token='kgcw-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);}
    localStorage.setItem('kgcw_v17_name_owner_token',token);
  }
  return token;
}
async function claimPlayerNameOnline(name,url,key,ownerPassword){
  if(!url||!key)return true;
  const wantedKey=localNameKey(name);
  const project=url.replace(/\/$/,'');
  const cleanPass=String(ownerPassword||'').trim();
  if(cleanPass.length<8)throw new Error('Oyuncu kayıt parolası en az 8 karakter olmalı. Aynı adını farklı sürümlerde kullanmak için aynı parolayı gir.');
  const ownedKey=localStorage.getItem('kgcw_v17_claimed_name_key')||'';
  const ownedProject=(localStorage.getItem('kgcw_v17_claimed_project_url')||'').replace(/\/$/,'');
  if(ownedKey===wantedKey && ownedProject===project)return true;
  const ownerToken=getNameOwnerToken();
  const response=await fetch(`${project}/rest/v1/rpc/claim_player_name`,{
    method:'POST',
    headers:{apikey:key,'Content-Type':'application/json',Accept:'application/json','Content-Profile':'public','Accept-Profile':'public'},
    body:JSON.stringify({p_player_name:name,p_owner_token:ownerToken,p_owner_password:cleanPass})
  });
  if(!response.ok){
    let detail='';try{detail=await response.text()}catch(e){}
    if(response.status===404)throw new Error('İsim kayıt fonksiyonu bulunamadı (HTTP 404). V18 SQL dosyasını Supabase SQL Editor’da yeniden çalıştır. Sonra 1-2 dakika bekleyip tekrar dene.');
    if(response.status===401||response.status===403)throw new Error(`Supabase erişim izni reddedildi (HTTP ${response.status}). Publishable key ve SQL function izinlerini kontrol et. ${detail.slice(0,160)}`);
    throw new Error(`İsim kaydı isteği başarısız (HTTP ${response.status}). Supabase yanıtı: ${detail.slice(0,260)}`);
  }
  let result;try{result=await response.json()}catch(e){throw new Error('Supabase yanıtı okunamadı. SQL fonksiyonunu ve bağlantıyı kontrol et.');}
  const row=Array.isArray(result)?result[0]:result;
  if(!row||row.ok!==true){
    if(row&&row.reason==='taken')throw new Error(`“${name}” adı başka bir oyuncu tarafından alınmış. Başka bir ad seç.`);
    if(row&&row.reason==='invalid_name')throw new Error('İsim 1 ile 18 karakter arasında olmalı.');
    if(row&&row.reason==='invalid_password')throw new Error('Oyuncu kayıt parolası en az 8 karakter olmalı.');
    throw new Error(`İsim reddedildi (${row&&row.reason?row.reason:'beklenmeyen yanıt'}). Ad daha önce alınmış olabilir veya kayıt fonksiyonunu yeniden kurmak gerekebilir.`);
  }
  localStorage.setItem('kgcw_v17_claimed_name_key',wantedKey);
  localStorage.setItem('kgcw_v17_claimed_player_name',name);
  localStorage.setItem('kgcw_v17_claimed_project_url',project);
  return true;
}
function getAutomaticNamePassword(){
  let pass=localStorage.getItem('kgcw_name_passphrase')||'';
  if(pass.length>=8)return pass;
  const token=getNameOwnerToken();
  // Generated and stored locally; the player never has to enter server credentials or a separate password.
  pass='KGauto-'+token+'-'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  localStorage.setItem('kgcw_name_passphrase',pass);
  return pass;
}
window.saveSettings=async()=>{
  const nameBox=document.getElementById('playerNameInput');
  const nm=(nameBox?.value||'').trim().replace(/[<>]/g,'').slice(0,18);
  if(!nm){alert('Ustam, önce bir oyuncu adı yaz.');nameBox?.focus();return;}
  const oldName=playerName;
  try{
    const autoPass=getAutomaticNamePassword();
    await claimPlayerNameOnline(nm,scoreApiUrl,scoreApiKey,autoPass);
  }catch(err){
    playerName=oldName;
    show(`<h2>⚠️ İsim kaydedilemedi</h2><p>${safeText(err.message||err)}</p><p class="small">İnternet bağlantısını kontrol et. Seçtiğin ad başka oyuncudaysa başka bir ad seç.</p><div class="grid"><button class="primary" onclick="settingsMenu()">Başka ad seç</button><button onclick="startWorld()">Kasabaya dön</button></div>`);return;
  }
  const isFirstName=!oldName;
  playerName=nm;
  localStorage.setItem('kgcw_player_name',playerName);
  saveProgress();refreshTop();
  if(isFirstName){startWorld();return;}
  show(`<h2>✅ Oyuncu adı kaydedildi</h2><p>Karakterinin adı artık <strong>${safeText(playerName)}</strong>.</p><div class="grid"><button class="primary" onclick="startWorld()">Kasabaya dön</button><button onclick="openLeaderboard()">Skor tablosu</button><button onclick="settingsMenu()">Adı değiştir</button></div>`);
};

function sortedLocalScores(){return [...localLeaderboard].sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0)).slice(0,20)}
function renderLeaderboard(rows, note=''){
  const body=rows.length?rows.map((r,i)=>`<tr><td style="padding:6px;border-bottom:1px solid #29445c">${i+1}</td><td style="padding:6px;border-bottom:1px solid #29445c">${safeText(r.name||r.player_name||'Bisikletçi')}</td><td style="padding:6px;border-bottom:1px solid #29445c;text-align:right">${Math.max(0,Math.floor(Number(r.score)||0)).toLocaleString('tr-TR')}</td></tr>`).join(''):'<tr><td colspan="3" style="padding:12px">Henüz skor yok. Bir yarış bitir!</td></tr>';
  show(`<h2>🏆 KG Skor Tablosu</h2><p class="small">Yüksek skor üstte görünür. ${safeText(note)}</p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:6px">#</th><th style="text-align:left;padding:6px">Oyuncu</th><th style="text-align:right;padding:6px">Skor</th></tr></thead><tbody>${body}</tbody></table><div class="grid"><button onclick="openLeaderboard()">🔄 Yenile</button><button onclick="settingsMenu()">👤 Adını değiştir</button><button class="primary" onclick="startWorld()">Kasabaya dön</button></div>`);
}
async function fetchOnlineScores(){
  const url=scoreApiUrl.replace(/\/$/,'');
  const resp=await fetch(`${url}/rest/v1/leaderboard?select=player_name,score,created_at&order=score.desc&limit=20`,{headers:{apikey:scoreApiKey} });
  if(!resp.ok)throw new Error(`Skor tablosu HTTP ${resp.status}`);
  return await resp.json();
}
window.openLeaderboard=async()=>{
  mode='leaderboard';renderLeaderboard(sortedLocalScores(),scoreApiUrl&&scoreApiKey?'Ortak tablo bağlanıyor…':'Ortak tabloya bağlanılamadı; internet bağlantısını kontrol et.');
  if(scoreApiUrl&&scoreApiKey){try{const remote=await fetchOnlineScores();if(mode==='leaderboard')renderLeaderboard(remote.map(r=>({name:r.player_name,score:r.score})),`Çevrim içi ortak tablo • ${remote.length} kayıt`)}catch(err){if(mode==='leaderboard')renderLeaderboard(sortedLocalScores(),`Çevrim içi bağlantı kurulamadı: ${String(err.message||err)}. Ayarlar ve tablo izinlerini kontrol et.`)}}
};
async function submitScore(points){
  const row={name:playerName,score:Math.max(0,Math.floor(Number(points)||0)),date:new Date().toISOString()};
  localLeaderboard.push(row);localLeaderboard=sortedLocalScores();localStorage.setItem('kgcw_leaderboard',JSON.stringify(localLeaderboard));
  if(scoreApiUrl&&scoreApiKey){try{const res=await fetch(`${scoreApiUrl}/rest/v1/leaderboard`,{method:'POST',headers:{apikey:scoreApiKey,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({player_name:playerName,score:row.score})});if(!res.ok)throw new Error(`Skor gönderme HTTP ${res.status}`);onlineBoardStatus='Skor çevrim içi tabloya gönderildi.';}catch(err){onlineBoardStatus=`Çevrim içi gönderim başarısız: ${String(err.message||err)}`;}}
}
window.addEventListener('message',event=>{
  const frame=document.getElementById('runnerFrame');
  if(!frame||event.source!==frame.contentWindow||!event.data)return;
  if(event.data.type==='KG_RUNNER_SCORE'){
    submitScore(event.data.score);
    const earned=Math.max(0,Math.floor(Number(event.data.coinsEarned)||0));
    if(earned>0){money+=earned;save();}
    return;
  }
  if(event.data.type==='KG_RUNNER_GAMEOVER'){
    document.getElementById('runnerLayer').style.display='none';
    frame.srcdoc='';
    setMusic('world');
    raceIntro();
  }
});
async function launchRunner(){
  try {
    if(scoreApiUrl&&scoreApiKey){
      try{await claimPlayerNameOnline(playerName,scoreApiUrl,scoreApiKey,localStorage.getItem('kgcw_name_passphrase')||'');}
      catch(nameErr){mode='raceIntro';show(`<h2>⚠️ Oyuncu adı kullanılamıyor</h2><p>${safeText(nameErr.message||nameErr)}</p><p>Yarışa girmeden önce Ayarlar bölümünden farklı bir ad seç.</p><div class="grid"><button class="primary" onclick="settingsMenu()">Adı değiştir</button><button onclick="raceIntro()">Geri</button></div>`);return;}
    }
    const layer=document.getElementById('runnerLayer');
    const frame=document.getElementById('runnerFrame');
    if(!layer||!frame)throw new Error('Yarış ekranı elementi bulunamadı.');
    const chosenBike=bikes.find(b=>b.id===raceBikeChoice)||bike();
    const colorMap={starter:'#43e6d1',flame:'#ff4c28',volt:'#e7ff42',frost:'#74caff',shadow:'#bd79ff',gold:'#ffd45c',forest:'#70e36d',pink:'#ff71cf'};
    const chosenColor=colorMap[raceBikeChoice]||chosenBike.color;
    let raw=atob(OLD_KG_RUNNER_BASE64);
    const bytes=Uint8Array.from(raw,ch=>ch.charCodeAt(0));
    let runnerHtml=new TextDecoder('utf-8').decode(bytes);
    runnerHtml=runnerHtml.replace(/let currentBikeColor = localStorage\.getItem\('kg_current_bike'\) \|\| "#00ffcc";/,`let currentBikeColor = ${JSON.stringify(chosenColor)};`);
    runnerHtml=runnerHtml.replace(/let currentGlobalTheme = 'NEON';/,`let currentGlobalTheme = ${JSON.stringify(raceTheme)};`);
    runnerHtml=runnerHtml.replace('{ name: "Neon Turkuaz", color: "#00ffcc", price: 0, nitro: 1.00 }','{ name: "Neon Turkuaz", color: "#43e6d1", price: 0, nitro: 1.00 }');
    runnerHtml=runnerHtml.replace('{ name: "Efsanevi Altın", color: "#ffd700", price: 100, nitro: 1.30 }','{ name: "Efsanevi Altın", color: "#ffd45c", price: 100, nitro: 1.30 }');
    runnerHtml=runnerHtml.replace('{ name: "Zehirli Yeşil", color: "#39ff14", price: 150, nitro: 1.00 }','{ name: "Zehirli Yeşil", color: "#70e36d", price: 150, nitro: 1.00 }');
    // Skip the original runner menu after the KG logo.
    runnerHtml=runnerHtml.replace(/if \(logoTimer >= logoDuration\) gameState = 'MENU';/,"if (logoTimer >= logoDuration) startGame();");
    // Show the selected player name above the bicycle in the race too.
    runnerHtml=runnerHtml.replace('drawPlayerBike(playerXAnim, pRoad.y);',`drawPlayerBike(playerXAnim, pRoad.y); ctx.save();ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText(${JSON.stringify(playerName)},playerXAnim,pRoad.y-86);ctx.restore();`);
    // Report a completed run to the town page's scoreboard exactly once.
    runnerHtml=runnerHtml.replace('function startGame() {','function startGame() { window.__kgScoreSent = false; window.__kgGameoverSent = false; window.__kgCrashPlayed = false; window.__kgCoinsAtStart = Number(totalCoins)||0;');
    runnerHtml=runnerHtml.replace("if (gameState === 'GAMEOVER') {\n                    uiEl.style.display = 'none';",
      "if (gameState === 'GAMEOVER') {\n                    if(window.__kgStopMusicAndPlayCrash)window.__kgStopMusicAndPlayCrash();\n                    if(!window.__kgScoreSent){window.__kgScoreSent=true;try{parent.postMessage({type:'KG_RUNNER_SCORE',score:Number(score)||0,coinsEarned:Math.max(0,(Number(totalCoins)||0)-(Number(window.__kgCoinsAtStart)||0))},'*')}catch(e){}}\n                    if(!window.__kgGameoverSent){window.__kgGameoverSent=true;setTimeout(()=>{try{parent.postMessage({type:'KG_RUNNER_GAMEOVER'},'*')}catch(e){}},450);}\n                    uiEl.style.display = 'none';");
    // A clearly audible synthesized melody. Browsers need an interaction inside the race frame.
    const musicPatch = `<button id="kgRunnerMusicToggle" style="position:fixed;z-index:99999;right:12px;top:12px;padding:10px 13px;border:2px solid #00ffcc;border-radius:8px;background:#07131d;color:#fff;font:bold 14px system-ui;cursor:pointer">🎵 MÜZİĞİ AÇ</button>
<script>(function(){const btn=document.getElementById('kgRunnerMusicToggle');let ac=null,master=null,timer=null,step=0,on=false;const melody=[523.25,659.25,783.99,659.25,587.33,698.46,783.99,880,783.99,698.46,659.25,587.33,523.25,587.33,659.25,783.99];function audioReady(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){btn.textContent='🔇 SES DESTEKLENMİYOR';return false;}if(!ac){ac=new AC();master=ac.createGain();master.gain.value=.32;master.connect(ac.destination);}if(ac.state==='suspended')ac.resume();return true;}function note(freq,t,d,gainVal,kind){const o=ac.createOscillator(),g=ac.createGain();o.type=kind||'triangle';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gainVal,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}function tick(){if(!on||!ac)return;const t=ac.currentTime,f=melody[step%melody.length];note(f,t,.20,.24,'triangle');if(step%4===0)note(f/2,t,.26,.18,'sine');step++;}function start(){if(!audioReady())return;on=true;btn.textContent='🎵 MÜZİĞİ KAPAT';if(timer)clearInterval(timer);tick();timer=setInterval(tick,220);}function stop(){on=false;if(timer)clearInterval(timer);timer=null;btn.textContent='🎵 MÜZİĞİ AÇ';}
function crashSound(){try{if(!audioReady())return;const t=ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(185,t);o.frequency.exponentialRampToValueAtTime(58,t+.24);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.38,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.29);o.connect(g);g.connect(master);o.start(t);o.stop(t+.31);const c=ac.createOscillator(),cg=ac.createGain();c.type='square';c.frequency.setValueAtTime(740,t+.015);c.frequency.exponentialRampToValueAtTime(240,t+.11);cg.gain.setValueAtTime(.0001,t+.015);cg.gain.exponentialRampToValueAtTime(.16,t+.03);cg.gain.exponentialRampToValueAtTime(.0001,t+.14);c.connect(cg);cg.connect(master);c.start(t+.015);c.stop(t+.15);}catch(e){console.warn('Crash sound failed:',e)}}

for(let l=1;l<3;l++){ctx.strokeStyle='#e5d78b';ctx.lineWidth=3;ctx.setLineDash([20,20]);ctx.beginPath();ctx.moveTo(500+(l-1.5)*53,200);ctx.lineTo(500+(l-1.5)*270,620);ctx.stroke();ctx.setLineDash([])}
if(mode==='race'){raceTime++;roadScroll+=4+ bike().speed;spawnRaceThings();playerProgress+=.12*bike().speed;botProgress+=.105+(Math.sin(raceTime/25)*.02);if(Math.random()<.02)botLane=Math.floor(Math.random()*3);if(fireCooldown>0)fireCooldown--;
}
for(let i=bottles.length-1;i>=0;i--){let b=bottles[i];if(mode==='race')b.z+=.009;let x=roadX(b.lane,b.z),y=200+420*b.z,s=8+b.z*18;ctx.save();ctx.shadowColor='#39f7ff';ctx.shadowBlur=20;ctx.fillStyle='#54f5ff';ctx.fillRect(x-s/2,y-s,s*.65,s);ctx.fillStyle='#dfffff';ctx.fillRect(x-s*.25,y-s*1.15,s*.25,s*.2);ctx.restore();if(b.z>.84&&b.lane===playerLane){nitro=Math.min(100,nitro+35);bottles.splice(i,1);continue}if(b.z>1.1)bottles.splice(i,1)}
for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];if(mode==='race')o.z+=.008;let x=roadX(o.lane,o.z),y=200+420*o.z,s=8+o.z*32;ctx.fillStyle=o.type==='oil'?'#111522':'#e7d1a0';ctx.beginPath();ctx.ellipse(x,y,s*1.2,s*.45,0,0,7);ctx.fill();if(o.z>.84&&o.lane===playerLane&&mode==='race'){playerProgress-=bikeId==='forest'?.2:.65;o.z=1.2;shake=8}if(o.z>1.1)obstacles.splice(i,1)}
let py=535;drawBike(roadX(playerLane,.88),py,bike().color,1.5);drawBike(roadX(botLane,.78),485,'#ff4b68',1.1);
ctx.fillStyle='#07111de8';ctx.fillRect(18,18,290,98);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 20px system-ui';ctx.fillText('🏁 ŞEHİR YARIŞI',34,47);ctx.font='15px system-ui';ctx.fillText('Sen: '+Math.max(0,Math.floor(playerProgress))+' m',34,74);ctx.fillText('Bot: '+Math.max(0,Math.floor(botProgress))+' m',34,98);
ctx.fillStyle='#111b2c';ctx.fillRect(720,24,240,24);ctx.fillStyle='#52f4ff';ctx.fillRect(720,24,240*nitro/100,24);ctx.strokeStyle='#dff';ctx.strokeRect(720,24,240,24);ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('NİTRO '+Math.floor(nitro)+'%',840,42);
if(mode==='race'&&playerProgress>=100){finishRace(playerProgress>=botProgress)}else if(mode==='race'&&botProgress>=100){finishRace(false)}
}
function finishRace(win){mode='finish';submitScore(Math.floor(Math.max(playerProgress,botProgress)));if(win){money+=100;score+=1;save()}setMusic('world');show(`<h2>${win?'🏆 ZAFER!':'🚴 Yarış Bitti'}</h2><p>${win?'Botu geçtin! 100 🪙 ödül kazandın.':'Bu kez bot kazandı. Bisikletini geliştirip tekrar dene!'}</p><div class="grid"><div class="bike"><strong>Senin mesafen</strong>${Math.floor(playerProgress)} m</div><div class="bike"><strong>Botun mesafesi</strong>${Math.floor(botProgress)} m</div></div><button class="primary" onclick="startRace()">🔁 Tekrar yarış</button> <button onclick="startWorld()">🌇 Şehre dön</button>`)}
function useNitro(){if(mode!=='race'||nitro<=0)return;nitro=Math.max(0,nitro-28);playerProgress+=7*bike().nitro;for(let i=0;i<12;i++)particles.push({x:roadX(playerLane,.9),y:540,vx:(Math.random()-.5)*5,vy:Math.random()*3+1,life:25,color:bike().color})}
function special(){if(mode!=='race'||fireCooldown>0)return;fireCooldown=100;if(bikeId==='flame'){botProgress=Math.max(0,botProgress-9);for(let i=0;i<20;i++)particles.push({x:roadX(playerLane,.85),y:505,vx:(Math.random()-.5)*7,vy:-Math.random()*4,life:30,color:'#ff682e'})}else if(bikeId==='frost'){botProgress=Math.max(0,botProgress-6)}else{playerProgress+=4*bike().speed;nitro=Math.max(0,nitro-8)}}
function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake--}if(mode==='world'||mode==='tent'||mode==='house')drawWorld();else if(mode==='race'||mode==='finish')drawRace();else{drawSky();ctx.fillStyle='#fff';ctx.font='bold 35px system-ui';ctx.textAlign='center';ctx.fillText('KG CYCLING WORLD',W/2,150)}ctx.restore();
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;
if(mode==='world'){ctx.fillStyle='#06111ddd';ctx.fillRect(18,H-64,360,44);ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='left';ctx.fillText('WASD ile gez • E: etkileşim • Yarışa git!',32,H-36)}
if(mode==='race'){ctx.fillStyle='#07111dcc';ctx.fillRect(370,H-60,260,40);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillText('A/D: şerit • SPACE: nitro • F: özel',500,H-35)}
requestAnimationFrame(draw)}
function move(dx,dy){if(mode!=='world')return;world.x=Math.max(55,Math.min(MAP_W-55,world.x+dx));world.y=Math.max(55,Math.min(MAP_H-55,world.y+dy))}
const townJoystick=document.getElementById('townJoystick'),townStick=document.getElementById('townStick'),mouseTargetHint=document.getElementById('mouseTargetHint'),touchInteractButton=document.getElementById('touchInteractButton');
let townJoyPointer=null,townJoyX=0,townJoyY=0;
function resetTownJoy(){townJoyPointer=null;townJoyX=0;townJoyY=0;townStick.style.left='38px';townStick.style.top='38px';}
function moveTownJoy(e){const r=townJoystick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const max=39,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max;}townJoyX=dx/max;townJoyY=dy/max;townStick.style.left=(41+dx-21)+'px';townStick.style.top=(41+dy-21)+'px';}
townJoystick.addEventListener('pointerdown',e=>{if(mode!=='world')return;e.preventDefault();e.stopPropagation();townJoyPointer=e.pointerId;try{townJoystick.setPointerCapture(e.pointerId)}catch(_){}mouseTarget=null;moveTownJoy(e)});
townJoystick.addEventListener('pointermove',e=>{if(townJoyPointer===e.pointerId){e.preventDefault();moveTownJoy(e)}});
const endTownJoy=e=>{if(townJoyPointer===e.pointerId)resetTownJoy()};townJoystick.addEventListener('pointerup',endTownJoy);townJoystick.addEventListener('pointercancel',endTownJoy);townJoystick.addEventListener('lostpointercapture',resetTownJoy);
c.addEventListener('click',e=>{if(mode!=='world'||panel.style.display!=='none')return;const r=c.getBoundingClientRect();const sx=(e.clientX-r.left)*(W/r.width),sy=(e.clientY-r.top)*(H/r.height);const camX=Math.max(0,Math.min(MAP_W-W,world.x-W/2)),camY=Math.max(0,Math.min(MAP_H-H,world.y-H/2));mouseTarget={x:Math.max(55,Math.min(MAP_W-55,sx+camX)),y:Math.max(55,Math.min(MAP_H-55,sy+camY))};});
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact();if(e.key===' '){e.preventDefault();useNitro()}if(e.key.toLowerCase()==='f')special();if(mode==='race'){if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')playerLane=Math.max(0,playerLane-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')playerLane=Math.min(2,playerLane+1)}if(e.key==='Escape'&&panel.style.display==='none')menu()});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function update(){const now=performance.now();
if(now-lastPersistTime>1500){saveProgress();lastPersistTime=now;}
if(mode==='world'){
  gameMinutes+=(now-lastClock)/1000*12;if(gameMinutes>=1440)gameMinutes-=1440;
  let vx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+townJoyX;
  let vy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+townJoyY;
  let len=Math.hypot(vx,vy);
  if(len>.08){mouseTarget=null;if(len>1){vx/=len;vy/=len;}move(vx*3.1,vy*3.1);}
  else if(mouseTarget){const dx=mouseTarget.x-world.x,dy=mouseTarget.y-world.y,d=Math.hypot(dx,dy);if(d<5)mouseTarget=null;else move(dx/d*Math.min(3.4,d),dy/d*Math.min(3.4,d));}
}
const showJoy=mode==='world'&&panel.style.display==='none';townJoystick.style.display=showJoy?'block':'none';touchInteractButton.style.display=showJoy&&(('ontouchstart' in window)||navigator.maxTouchPoints>0||window.matchMedia('(pointer:coarse)').matches||window.innerWidth<=800)?'flex':'none';mouseTargetHint.style.display=showJoy&&window.matchMedia('(pointer:fine)').matches?'block':'none';
lastClock=now;requestAnimationFrame(update)}update();
document.getElementById('left').onclick=()=>{if(mode==='world')move(-25,0);else if(mode==='race')playerLane=Math.max(0,playerLane-1)};
document.getElementById('right').onclick=()=>{if(mode==='world')move(25,0);else if(mode==='race')playerLane=Math.min(2,playerLane+1)};
document.getElementById('interact').onclick=interact;
touchInteractButton.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(mode==='world'&&panel.style.display==='none')interact();});
touchInteractButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(mode==='world'&&panel.style.display==='none')interact();});
document.getElementById('nitro').onclick=useNitro;
let musicGain=null,oscillators=[];
function initAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();musicGain=audio.createGain();musicGain.gain.value=.42;musicGain.connect(audio.destination)}if(audio.state==='suspended')audio.resume().catch(err=>console.warn('Audio resume failed:',err))}
function setMusic(which){if(!soundOn)return;initAudio();if(musicMode===which)return;musicMode=which;oscillators.forEach(o=>{try{o.stop()}catch(e){}});oscillators=[];if(musicTimer)clearInterval(musicTimer);
let step=0;musicTimer=setInterval(()=>{if(!soundOn)return;let notes=which==='race'?[110,146.8,164.8,196,220,196,164.8,146.8]:[261.6,329.6,392,329.6,293.7,349.2,392,349.2];let freq=notes[step%notes.length];let o=audio.createOscillator(),g=audio.createGain();o.type=which==='race'?'sawtooth':'triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(which==='race'?.20:.15,audio.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+(which==='race'?.18:.3));o.connect(g);g.connect(musicGain);o.start();o.stop(audio.currentTime+(which==='race'?.2:.32));step++},which==='race'?190:300)}
window.toggleMusic=()=>{soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'Müziği Kapat':'Müziği Aç';if(soundOn){initAudio();setMusic(mode==='race'?'race':'world')}else{if(musicTimer)clearInterval(musicTimer);oscillators.forEach(o=>{try{o.stop()}catch(e){}});musicMode=''}};
document.getElementById('soundBtn').onclick=window.toggleMusic;
// Browser autoplay restrictions require a user gesture. Turn on the town soundtrack
// on the first interaction, except when the user explicitly clicks the sound toggle.
document.addEventListener('pointerdown',e=>{
  if(e.target && e.target.id==='soundBtn') return;
  if(!soundOn){soundOn=true;document.getElementById('soundBtn').textContent='Müziği Kapat';try{initAudio();setMusic(mode==='race'?'race':'world')}catch(err){console.warn('Town audio could not start:',err)}}
},{once:true,capture:true});
document.addEventListener('keydown',()=>{
  if(!soundOn){soundOn=true;document.getElementById('soundBtn').textContent='Müziği Kapat';try{initAudio();setMusic(mode==='race'?'race':'world')}catch(err){console.warn('Town audio could not start:',err)}}
},{once:true});
window.addEventListener('pagehide',saveProgress);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProgress()});
refreshTop();menu();draw();
})();
